name: Publicar site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Coloca o site na raiz publicada
        run: |
          cp dist/client/index.html dist/client/404.html dist/client/.nojekyll dist/client/favicon.svg dist/client/og.jpg dist/client/x-banner.jpg .
          rm -rf assets fonts template __grok
          cp -a dist/client/assets dist/client/fonts dist/client/template dist/client/__grok .
          git config user.name "Adriele Almeida"
          git config user.email "223020238+Adriele-Almeida@users.noreply.github.com"
          git add index.html 404.html .nojekyll favicon.svg og.jpg x-banner.jpg assets fonts template __grok
          if git diff --cached --quiet; then
            echo "Site já está atualizado."
          else
            git commit -m "Atualiza o site publicado."
            git push
          fi
